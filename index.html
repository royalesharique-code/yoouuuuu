<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Pranjal 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    min-height: 100%;
    font-family: 'Poppins', sans-serif;
  }

  body {
    background: linear-gradient(135deg, #ffdde1 0%, #ffc3d4 40%, #ff9eb5 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 20px;
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.4), transparent 60%);
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 2;
    text-align: center;
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 28px;
    padding: 50px 30px;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(179, 0, 60, 0.15);
    animation: fadeIn 1.8s ease forwards;
    opacity: 0;
  }

  .title {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2.8rem, 9vw, 5rem);
    color: #b3003c;
    text-shadow: 0 4px 20px rgba(179, 0, 60, 0.2);
    line-height: 1.2;
  }

  .name {
    display: block;
    font-size: clamp(3rem, 11vw, 6rem);
    color: #8b0029;
    margin-top: 8px;
  }

  .subtitle {
    font-size: clamp(0.95rem, 2.4vw, 1.15rem);
    color: #7a1f3d;
    margin-top: 22px;
    font-weight: 300;
  }

  .buttons {
    margin-top: 34px;
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    padding: 14px 30px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
  }

  .yes-btn {
    background: linear-gradient(135deg, #ff4d79, #b3003c);
    color: #fff;
    box-shadow: 0 8px 20px rgba(179, 0, 60, 0.35);
  }

  .yes-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 26px rgba(179, 0, 60, 0.45);
  }

  .no-btn {
    background: rgba(255, 255, 255, 0.7);
    color: #b3003c;
  }

  .no-btn:hover {
    transform: translateY(-3px);
  }

  /* Hidden sections */
  .hidden {
    display: none;
  }

  .fade-section {
    animation: fadeIn 1.2s ease forwards;
    opacity: 0;
  }

  .question {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2rem, 7vw, 3.4rem);
    color: #b3003c;
    line-height: 1.3;
  }

  .sub-question {
    font-size: clamp(0.95rem, 2.4vw, 1.1rem);
    color: #7a1f3d;
    margin-top: 14px;
    font-weight: 300;
  }

  .days {
    margin-top: 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .day {
    background: rgba(255, 255, 255, 0.75);
    color: #8b0029;
    padding: 12px 22px;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.25s ease;
    user-select: none;
  }

  .day:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 18px rgba(179, 0, 60, 0.2);
  }

  .day.selected {
    background: linear-gradient(135deg, #ff4d79, #b3003c);
    color: #fff;
    border-color: #b3003c;
    transform: scale(1.05);
  }

  .confirm-btn {
    margin-top: 30px;
    background: linear-gradient(135deg, #ff4d79, #b3003c);
    color: #fff;
    box-shadow: 0 8px 20px rgba(179, 0, 60, 0.35);
    opacity: 0.4;
    pointer-events: none;
  }

  .confirm-btn.active {
    opacity: 1;
    pointer-events: auto;
  }

  .confirm-btn.active:hover {
    transform: translateY(-3px) scale(1.05);
  }

  .final-message {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2rem, 7vw, 3.4rem);
    color: #b3003c;
    line-height: 1.4;
  }

  .final-sub {
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    color: #7a1f3d;
    margin-top: 18px;
    font-weight: 300;
  }

  /* Floating hearts */
  .heart {
    position: absolute;
    bottom: -50px;
    font-size: 24px;
    pointer-events: none;
    user-select: none;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-115vh) scale(1.3) rotate(360deg); opacity: 0; }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>

  <!-- STEP 1: Will you be mine? -->
  <div class="card" id="step1">
    <h1 class="title">
      Will you be mine
      <span class="name">Pranjal?</span>
    </h1>
    <p class="subtitle">I've been wanting to ask you this for a while… 💕</p>
    <div class="buttons">
      <button class="yes-btn" onclick="showDayPicker()">Yes 💖</button>
      <button class="no-btn" id="noBtn" onmouseover="moveNoBtn()" onclick="moveNoBtn()">No</button>
    </div>
  </div>

  <!-- STEP 2: Which day are you free? -->
  <div class="card hidden" id="step2">
    <h2 class="question">Yay! 🥰</h2>
    <p class="sub-question">Let's plan a day out — which day are you free?</p>
    <div class="days" id="dayList">
      <div class="day" onclick="selectDay(this)">Monday</div>
      <div class="day" onclick="selectDay(this)">Tuesday</div>
      <div class="day" onclick="selectDay(this)">Wednesday</div>
      <div class="day" onclick="selectDay(this)">Thursday</div>
      <div class="day" onclick="selectDay(this)">Friday</div>
      <div class="day" onclick="selectDay(this)">Saturday</div>
      <div class="day" onclick="selectDay(this)">Sunday</div>
    </div>
    <button class="confirm-btn" id="confirmBtn" onclick="confirmDay()">Confirm 💌</button>
  </div>

  <!-- STEP 3: Final message -->
  <div class="card hidden" id="step3">
    <h2 class="final-message">Can't wait, Pranjal! 💖</h2>
    <p class="final-sub" id="finalText"></p>
  </div>

  <script>
    // ===== Floating hearts =====
    const heartSymbols = ['❤️', '💖', '💕', '💗', '🌸'];
    for (let i = 0; i < 18; i++) {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (8 + Math.random() * 8) + 's';
      heart.style.animationDelay = Math.random() * 10 + 's';
      heart.style.fontSize = (16 + Math.random() * 22) + 'px';
      document.body.appendChild(heart);
    }

    // ===== Step 1: "No" button runs away =====
    function moveNoBtn() {
      const btn = document.getElementById('noBtn');
      const x = (Math.random() - 0.5) * 300;
      const y = (Math.random() - 0.5) * 200;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }

    // ===== Step 1 → Step 2 =====
    function showDayPicker() {
      document.getElementById('step1').classList.add('hidden');
      const step2 = document.getElementById('step2');
      step2.classList.remove('hidden');
      step2.classList.add('fade-section');
    }

    // ===== Day selection =====
    let selectedDay = null;

    function selectDay(el) {
      document.querySelectorAll('.day').forEach(d => d.classList.remove('selected'));
      el.classList.add('selected');
      selectedDay = el.textContent;
      document.getElementById('confirmBtn').classList.add('active');
    }

    // ===== Step 2 → Step 3 =====
    function confirmDay() {
      if (!selectedDay) return;
      document.getElementById('step2').classList.add('hidden');
      const step3 = document.getElementById('step3');
      step3.classList.remove('hidden');
      step3.classList.add('fade-section');
      document.getElementById('finalText').textContent =
        `Let's plan our day out for ${selectedDay}. 💕`;

      // Confetti hearts burst
      burstHearts();
    }

    // ===== Confetti heart burst =====
    function burstHearts() {
      for (let i = 0; i < 40; i++) {
        const h = document.createElement('div');
        h.textContent = '💖';
        h.style.position = 'fixed';
        h.style.left = '50%';
        h.style.top = '50%';
        h.style.fontSize = (18 + Math.random() * 20) + 'px';
        h.style.pointerEvents = 'none';
        h.style.zIndex = '999';
        h.style.transition = 'transform 1.8s ease-out, opacity 1.8s ease-out';
        document.body.appendChild(h);

        const angle = Math.random() * Math.PI * 2;
        const dist = 150 + Math.random() * 350;
        const x = Math.cos(angle) * dist;
        const y = Math.sin(angle) * dist;

        requestAnimationFrame(() => {
          h.style.transform = `translate(${x}px, ${y}px) scale(1.6) rotate(${Math.random()*360}deg)`;
          h.style.opacity = '0';
        });

        setTimeout(() => h.remove(), 2000);
      }
    }
  </script>

</body>
</html>
